<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
  <script src="https://cdn.jsdelivr.net/jquery/2.2.1/jquery.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      background-color: #f0f4f8;
    }

    .sidebar {
      width: 30%;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sidebar h1 {
      margin: 0;
      margin-bottom: 20px;
      font-size: 1.8em;
      text-align: center;
    }

    .question-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .question-list button {
      width: 40px;
      height: 40px;
      margin: 5px;
      background-color: #34495e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .question-list button:hover {
      background-color: #1abc9c;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      background-color: #ffffff;
    }

    .question-box {
      margin-bottom: 20px;
      font-size: 1.4em;
      color: #333;
      max-width: 60%;
      margin-left: auto;
      margin-right: auto;
    }

    .options {
      display: flex;
      flex-direction: column;
      margin-left: 20px;
    }

    .options input[type="radio"] {
      margin: 10px 0;
    }

    .control-buttons {
      margin-top: 30px;
    }

    .control-buttons button {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    .control-buttons button:hover {
      background-color: #3498db;
    }

    #timer {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 1.2em;
      font-weight: bold;
      color: #333;
    }

    .footer {
      width: 100%;
      text-align: center;
      padding: 10px;
      background-color: #34495e;
      color: white;
      position: fixed;
      bottom: 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h1>Python Quiz</h1>
  <div class="question-list" id="question-list">
    <button onclick="showQuestion(0)">1</button>
    <button onclick="showQuestion(1)">2</button>
    <button onclick="showQuestion(2)">3</button>
    <button onclick="showQuestion(3)">4</button>
    <button onclick="showQuestion(4)">5</button>
    <button onclick="showQuestion(5)">6</button>
    <button onclick="showQuestion(6)">7</button>
    <button onclick="showQuestion(7)">8</button>
    <button onclick="showQuestion(8)">9</button>
    <button onclick="showQuestion(9)">10</button>
  </div>
  <p id="timer">Time Left: 1:00</p>
</div>

<div class="main-content" id="main-content">
  <div class="question-box" id="question-text">Click on a question number to start.</div>
  <div class="options" id="options">
    <!-- Options will be dynamically populated here -->
  </div>
  <div class="control-buttons hidden" id="control-buttons">
    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>
    <button onclick="showAnswer()">Check Answer</button>
    <button onclick="submitQuiz()">Finish Quiz</button>
    <button onclick="reListen()">Re-listen to Question</button>
  </div>
</div>

<div class="footer">
  <p>@pythonquiz.com</p>
</div>

<script>
  let timerStarted = false;
  let timeLeft = 60;
  let timerInterval;
  let currentIndex = 0;
  let question = [
    "Who developed Python?",
    "Which of the following is a mutable data type in Python?",
    "What will be the output of the following code? `print(3 * 'Python')`",
    "Which of the following methods can be used to remove the last element from a list?",
    "What is the correct way to define a function in Python?",
    "What does the `self` keyword represent in Python classes?",
    "What is the difference between `deepcopy()` and `copy()` in Python?",
    "Which of the following is used to handle exceptions in Python?",
    "What does the `yield` keyword do in Python?",
    "Which of the following data types are immutable in Python?"
  ];
  let opt1 = ["Guido van Rossum", "List", "PythonPythonPython", "pop()", "def function_name():", "It refers to the instance of the class", "deepcopy creates a new object, copy does not", "try/except", "It defines a generator", "List"];
  let opt2 = ["Dennis Ritchie", "Tuple", "Python", "remove()", "function function_name():", "It refers to the class itself", "copy creates a new object, deepcopy does not", "raise/except", "It defines an iterator", "String"];
  let opt3 = ["James Gosling", "Set", "Error", "clear()", "def function():", "It refers to the parent class", "Both create copies of the object", "catch/throw", "It defines a coroutine", "Int"];
  let opt4 = ["Bjarne Stroustrup", "Dictionary", "None", "popitem()", "function def function_name():", "It is used to handle static methods", "None of the above", "finally", "It does not return anything", "Tuple and String"];
  let correctans = ["Guido van Rossum", "List", "PythonPythonPython", "pop()", "def function_name():", "It refers to the instance of the class", "deepcopy creates a new object, copy does not", "try/except", "It defines a generator", "Tuple and String"];
  let score = new Array(10).fill(0);

  function showQuestion(index) {
    if (!timerStarted) {
      startTimer();
      timerStarted = true;
      document.getElementById("control-buttons").classList.remove("hidden"); // Show buttons when quiz starts
    }
    currentIndex = index;
    document.getElementById("question-text").innerHTML = question[index];
    document.getElementById("options").innerHTML = `
      <input type='radio' name='x' value='${opt1[index]}'> ${opt1[index]}<br>
      <input type='radio' name='x' value='${opt2[index]}'> ${opt2[index]}<br>
      <input type='radio' name='x' value='${opt3[index]}'> ${opt3[index]}<br>
      <input type='radio' name='x' value='${opt4[index]}'> ${opt4[index]}
    `;
    responsiveVoice.speak(question[index], "UK English Male"); // Speak question
    responsiveVoice.speak("Option 1: " + opt1[index], "UK English Male"); // Speak options
    responsiveVoice.speak("Option 2: " + opt2[index], "UK English Male");
    responsiveVoice.speak("Option 3: " + opt3[index], "UK English Male");
    responsiveVoice.speak("Option 4: " + opt4[index], "UK English Male");
  }

  function startTimer() {
    timerInterval = setInterval(function() {
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        submitQuiz();
      } else {
        timeLeft--;
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById("timer").textContent = `Time Left: ${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
      }
    }, 1000);
  }

  function previous() {
    if (currentIndex > 0) {
      showQuestion(currentIndex - 1);
    }
  }

  function next() {
    if (currentIndex < question.length - 1) {
      showQuestion(currentIndex + 1);
    }
  }

  function showAnswer() {
    let selectedOption = document.querySelector("input[name='x']:checked");
    if (selectedOption) {
      if (selectedOption.value === correctans[currentIndex]) {
        score[currentIndex] = 1;
        alert("Correct answer!");
      } else {
        score[currentIndex] = 0;
        alert("Incorrect answer!");
      }
    } else {
      alert("Please select an option.");
    }
  }

  function submitQuiz() {
    let totalScore = score.reduce((sum, s) => sum + s, 0);
    alert(`You scored ${totalScore} out of 10!`);
    // Logic for submitting the quiz results can be added here
  }

  function reListen() {
    responsiveVoice.speak(question[currentIndex], "UK English Male");
    responsiveVoice.speak("Option 1: " + opt1[currentIndex], "UK English Male");
    responsiveVoice.speak("Option 2: " + opt2[currentIndex], "UK English Male");
    responsiveVoice.speak("Option 3: " + opt3[currentIndex], "UK English Male");
    responsiveVoice.speak("Option 4: " + opt4[currentIndex], "UK English Male");
  }
</script>

</body>
</html>
