<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8; /* Soft background color */
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .result-container {
      text-align: center;
      background-color: #ffffff;
      padding: 40px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .result-container h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .result-container p {
      font-size: 1.2em;
      color: #2980b9;
    }

    .retry-button {
      background-color: #2980b9;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 20px;
    }

    .retry-button:hover {
      background-color: #3498db;
    }
  </style>
</head>
<body>
  <div class="result-container">
    <h1>Quiz Result</h1>
    <p>Your Final Score is <span id="score"></span> out of 10</p>
    <button class="retry-button" onclick="retryQuiz()">Retry Quiz</button>
  </div>

  <script>
    document.getElementById("score").textContent = localStorage.getItem("quizScore");

    function retryQuiz() {
      window.location.href = "index.html"; // Assuming your main quiz page is named index.html
    }
  </script>
</body>
</html>
