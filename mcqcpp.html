<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.responsivevoice.org/responsivevoice.js"></script>
  <script src="https://cdn.jsdelivr.net/jquery/2.2.1/jquery.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      background-color: #f0f4f8;
    }

    .sidebar {
      width: 30%;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sidebar h1 {
      margin: 0;
      margin-bottom: 20px;
      font-size: 1.8em;
      text-align: center;
    }

    .question-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .question-list button {
      width: 40px;
      height: 40px;
      margin: 5px;
      background-color: #34495e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .question-list button:hover {
      background-color: #1abc9c;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      background-color: #ffffff;
    }

    .question-box {
      margin-bottom: 20px;
      font-size: 1.4em;
      color: #333;
      max-width: 60%;
      margin-left: auto;
      margin-right: auto;
    }

    .options {
      display: flex;
      flex-direction: column;
      margin-left: 20px;
    }

    .options input[type="radio"] {
      margin: 10px 0;
    }

    .control-buttons {
      margin-top: 30px;
    }

    .control-buttons button {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    .control-buttons button:hover {
      background-color: #3498db;
    }

    #timer {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 1.2em;
      font-weight: bold;
      color: #333;
    }

    .footer {
      width: 100%;
      text-align: center;
      padding: 10px;
      background-color: #34495e;
      color: white;
      position: fixed;
      bottom: 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <h1>C++ Quiz</h1>
  <div class="question-list" id="question-list">
    <button onclick="showQuestion(0)">1</button>
    <button onclick="showQuestion(1)">2</button>
    <button onclick="showQuestion(2)">3</button>
    <button onclick="showQuestion(3)">4</button>
    <button onclick="showQuestion(4)">5</button>
    <button onclick="showQuestion(5)">6</button>
    <button onclick="showQuestion(6)">7</button>
    <button onclick="showQuestion(7)">8</button>
    <button onclick="showQuestion(8)">9</button>
    <button onclick="showQuestion(9)">10</button>
  </div>
  <p id="timer">Time Left: 1:00</p>
</div>

<div class="main-content" id="main-content">
  <div class="question-box" id="question-text">Click on a question number to start.</div>
  <div class="options" id="options">
    <!-- Options will be dynamically populated here -->
  </div>
  <div class="control-buttons hidden" id="control-buttons">
    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>
    <button onclick="showAnswer()">Check Answer</button>
    <button onclick="submitQuiz()">Finish Quiz</button>
    <button onclick="reListen()">Re-listen to Question</button>
  </div>
</div>

<div class="footer">
  <p>@cppquiz.com</p>
</div>

<script>
  let timerStarted = false;
  let timeLeft = 60;
  let timerInterval;
  let currentIndex = 0;
  let question = [
    "Which of the following is the correct way to declare a class in C++?",
    "What is the output of the following code? int a = 5; std::cout << a++;",
    "Which of the following is an example of polymorphism in C++?",
    "What is the purpose of the 'friend' keyword in C++?",
    "Which of the following is used for function overloading in C++?",
    "What is the correct way to define a constructor in C++?",
    "What is the purpose of 'virtual' keyword in C++?",
    "Which of the following is the correct way to create a pointer to a class object?",
    "What is a template in C++?",
    "What does the 'public' access modifier mean in C++?"
  ];
  let opt1 = [
    "class MyClass { };", 
    "5", 
    "Using base class pointers to call derived class methods", 
    "To allow non-member functions to access private class members", 
    "By defining multiple functions with the same name but different parameter types", 
    "MyClass() { }", 
    "To allow runtime method binding", 
    "MyClass* ptr;", 
    "A blueprint for creating classes and functions", 
    "It allows the members of the class to be accessible outside the class"
  ];
  let opt2 = [
    "MyClass class { };", 
    "6", 
    "Using method overriding", 
    "To declare variables that are shared by all instances of the class", 
    "By defining functions with the same name and the same number of parameters", 
    "MyClass() : member_var(0) { }", 
    "To allow compile-time method binding", 
    "MyClass ptr;", 
    "A feature for creating functions and classes that work with different data types", 
    "It restricts the members of the class to be accessible only within the class"
  ];
  let opt3 = [
    "class MyClass [ ];", 
    "Compilation error", 
    "Using function overloading", 
    "To grant a function access to the private members of another class", 
    "By defining a base class with the same function signature", 
    "MyClass() { member_var = 10; }", 
    "To allow inheritance of method implementations", 
    "MyClass* ptr = new MyClass();", 
    "A method for defining a function that can accept any data type", 
    "It allows the class members to be inherited by child classes"
  ];
  let opt4 = [
    "class MyClass; { };", 
    "Compilation warning", 
    "Using base class constructors", 
    "To allow external functions to call class methods directly", 
    "By defining methods with the same name and the same parameter types", 
    "MyClass() { } public;", 
    "To allow function overloading", 
    "MyClass ptr = new MyClass();", 
    "A mechanism for defining type-independent code", 
    "It allows the members of the class to be accessible only within the class and its derived classes"
  ];
  let correctans = [
    "class MyClass { };", 
    "5", 
    "Using base class pointers to call derived class methods", 
    "To allow non-member functions to access private class members", 
    "By defining multiple functions with the same name but different parameter types", 
    "MyClass() { }", 
    "To allow runtime method binding", 
    "MyClass* ptr;", 
    "A blueprint for creating classes and functions", 
    "It allows the members of the class to be accessible outside the class"
  ];
  let score = new Array(10).fill(0);

  function showQuestion(index) {
    if (!timerStarted) {
      startTimer();
      timerStarted = true;
      document.getElementById("control-buttons").classList.remove("hidden"); // Show buttons when quiz starts
    }
    currentIndex = index;
    document.getElementById("question-text").innerHTML = question[index];
    document.getElementById("options").innerHTML = `
      <input type='radio' name='x' value='${opt1[index]}'> ${opt1[index]}<br>
      <input type='radio' name='x' value='${opt2[index]}'> ${opt2[index]}<br>
      <input type='radio' name='x' value='${opt3[index]}'> ${opt3[index]}<br>
      <input type='radio' name='x' value='${opt4[index]}'> ${opt4[index]}
    `;
    responsiveVoice.speak(question[index], "UK English Male"); // Read the question aloud
  }

  function startTimer() {
    timerInterval = setInterval(function() {
      timeLeft--;
      document.getElementById("timer").innerHTML = "Time Left: " + Math.floor(timeLeft / 60) + ":" + (timeLeft % 60);
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        alert("Time's up!");
      }
    }, 1000);
  }

  function next() {
    if (currentIndex < 9) {
      showQuestion(currentIndex + 1);
    }
  }

  function previous() {
    if (currentIndex > 0) {
      showQuestion(currentIndex - 1);
    }
  }

  function showAnswer() {
    let options = document.getElementsByName('x');
    let selectedOption;
    for (let i = 0; i < options.length; i++) {
      if (options[i].checked) {
        selectedOption = options[i].value;
        break;
      }
    }
    alert("Your selected answer is: " + selectedOption + "\nCorrect answer is: " + correctans[currentIndex]);
  }

  function submitQuiz() {
    let totalScore = 0;
    for (let i = 0; i < 10; i++) {
      let options = document.getElementsByName('x');
      let selectedOption;
      for (let j = 0; j < options.length; j++) {
        if (options[j].checked) {
          selectedOption = options[j].value;
          break;
        }
      }
      if (selectedOption === correctans[i]) totalScore++;
    }
    alert("You scored " + totalScore + " out of 10");
  }

  function reListen() {
    responsiveVoice.speak(question[currentIndex], "UK English Male");
  }
</script>

</body>
</html>
